name: Publish OCI tarball bundle

# The no-registry path: an air-gapped runner, a fork that cannot authenticate
# to npm, or pinning a build that was never released. One GHCR artifact holds
# every workspace tarball, because they must be installed together.
#
# Independent of npm-publish.yml. This workflow overwrites `main` on every
# merge; npm never runs here. `latest` moves only on a version tag.
#
# Implementation: `.github/workflows/oci-publish-tarballs.yml`.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tags:
        description: "Whitespace-separated OCI tags to publish under."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish tarball bundle
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/oci-publish-tarballs.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/aplaytest-packages
      tags: ${{ inputs.tags != '' && inputs.tags
                || (startsWith(github.ref, 'refs/tags/')
                    && format('{0} {1} latest', github.ref_name, github.sha)
                    || format('main {0}', github.sha)) }}
      node-version: "22"
      # --ignore-scripts everywhere else in this repo's CI, but not here: the
      # build has to run, and it is this repo's own lockfile.
      install-command: npm ci
      build-command: npm run build
      pack-command: npm run pack
      tarball-dir: dist-pack
      bundle-name: aplaytest-packages-{version}.tar.gz
      # scripts/pack.ts names them explicitly. If that list changes, this
      # number is the thing that makes it a deliberate change rather than a
      # consumer discovering a missing package at import time.
      expected-tarballs: 12
      verify-install: true
      # Loading the reporter from CommonJS is what Playwright actually does —
      # `require.resolve` from a CJS context — and it is the entry point most
      # likely to break in a way `npm install` cannot see.
      verify-command: |
        node --input-type=commonjs -e "
          const r = require('@aplaytest/runner-playwright/reporter');
          if (typeof r.default !== 'function') { throw new Error('CJS reporter did not load from the tarball'); }
        "
        node --input-type=module -e "
          import { BlobHistoryStore } from '@aplaytest/store-azure';
          if (typeof BlobHistoryStore !== 'function') { throw new Error('Azure history store did not load'); }
        "
        npx aplaytest --help > /dev/null
      artifact-type: application/vnd.atest.packages.v1
      attest-provenance: true
      attach-to-release: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

  # Same constraint as docker-publish.yml: personal-account GHCR visibility is
  # a one-time UI click. Re-running this workflow cannot flip it.
  visibility:
    name: GHCR packages public
    needs: [publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require anonymous pulls
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          pkg=aplaytest-packages
          accept='Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          url="https://ghcr.io/v2/${OWNER}/${pkg}/manifests/${REF}"
          tok=$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${pkg}:pull" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("token") or d.get("access_token") or "")')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$accept" \
            ${tok:+-H} ${tok:+"Authorization: Bearer $tok"} "$url")
          if [ "$code" = "200" ]; then
            echo "::notice title=GHCR::${pkg}:${REF} is anonymously pullable"
            exit 0
          fi
          echo "::error title=GHCR::${pkg} is not public (HTTP ${code} for tag ${REF})."
          echo "GitHub has no API to change visibility of a personal-account package."
          echo "Open https://github.com/users/${OWNER}/packages/container/${pkg}/settings"
          echo "Danger Zone → Change visibility → Public. One click; later pushes stay public."
          exit 1
