name: Publish Image

# Publishes the atest container images to GHCR.
#
# ── Why an image at all, when tarballs are already published ──────────────────
# They serve different consumers and both are needed:
#
#   tarballs (oci-publish.yml / npm-publish.yml)
#                           a Node repo installing atest as a DEPENDENCY,
#                           because the reporter loads inside the Playwright
#                           process and cannot come from a container
#   image (this)            a CI job that only wants to RUN the CLI, in any
#                           language's repo
#
# The second is what atest-analyze.yml consumes: a Java (or any non-Node)
# repository can run the CLI without installing Node.
#
# ── Two images, published on different schedules ──────────────────────────────
#   aplaytest             ~0.5 GB   the analyze surface. Every main push.
#   aplaytest-playwright  ~3.9 GB   adds gate/heal/bisect/authoring, which spawn
#                               browsers. TAGS AND DISPATCH ONLY — eight times
#                               the storage and build time, for commands a
#                               pipeline runs rarely. Pushing 3.9 GB on every
#                               merge is a bill, not a feature.
#
# ── PRs build the CLI image without pushing ───────────────────────────────────
# `push: false` on pull requests. The Dockerfile's own smoke tests are where a
# broken image gets caught — the global-install layout that made the Azure
# driver unreachable was found by the build refusing to complete.
#
# The playwright (~3.9 GB) target is tags and dispatch only. A PR that
# breaks the browser pairing is caught when a tag is cut, not on every
# packages/** change — pulling 4 GB on a docs-adjacent PR teaches people
# to ignore the check. Pin PLAYWRIGHT_VERSION in this file and the
# Dockerfile together; the launch check in the playwright stage is what
# enforces the pairing when that target does build.
#
# Image build/push is `.github/workflows/docker-build-push.yml` in this repo.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    # Only when something that lands in the image changes. A docs-only PR
    # rebuilding a 500 MB image teaches people to ignore the check.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      publish-playwright:
        description: "Also build and push the browser image (~3.9 GB)."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cli:
    name: aplaytest (cli)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image-name: aplaytest
      dockerfile: Dockerfile
      target: cli
      platforms: linux/amd64
      push: ${{ github.event_name != 'pull_request' }}
      sign: ${{ github.event_name != 'pull_request' }}
      attest: ${{ github.event_name != 'pull_request' }}
      scan: true
      trivy-exit-code: "0"
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,format=short
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      # PLAYWRIGHT_VERSION governs both the base image tag and the npm version
      # installed into the image; they must agree or the browser refuses to
      # start. Left unset it takes the Dockerfile default. Stated here so the
      # value is visible to anyone reading the pipeline rather than only to
      # someone reading the Dockerfile.
      build-args: |
        PLAYWRIGHT_VERSION=1.61.0
        VCS_REF=${{ github.sha }}

  playwright:
    name: aplaytest-playwright (browsers)
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish-playwright
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image-name: aplaytest-playwright
      dockerfile: Dockerfile
      target: playwright
      platforms: linux/amd64
      push: true
      sign: true
      attest: true
      scan: false
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,format=short
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      build-args: |
        PLAYWRIGHT_VERSION=1.61.0
        VCS_REF=${{ github.sha }}

  summary:
    name: Publish summary
    needs: [cli, playwright]
    if: always() && needs.cli.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write what was published
        env:
          CLI_REF: ${{ needs.cli.outputs.image-ref }}
          CLI_TAG: ${{ needs.cli.outputs.image-tag }}
          CLI_DIGEST: ${{ needs.cli.outputs.image-digest }}
          PW_TAG: ${{ needs.playwright.outputs.image-tag }}
          PW_RESULT: ${{ needs.playwright.result }}
        shell: bash
        run: |
          {
            echo "### aplaytest images"
            echo ""
            echo "| image | tag | digest |"
            echo "|---|---|---|"
            echo "| \`${CLI_REF:-aplaytest}\` | \`${CLI_TAG:-—}\` | \`${CLI_DIGEST:-—}\` |"
            if [ "${PW_RESULT}" = "success" ]; then
              echo "| aplaytest-playwright | \`${PW_TAG:-—}\` | published |"
            else
              echo "| aplaytest-playwright | — | skipped (tags and dispatch only) |"
            fi
            echo ""
            echo "Consume the analyze image with:"
            echo ""
            echo '```yaml'
            echo "container:"
            echo "  image: ${CLI_REF:-ghcr.io/${{ github.repository_owner }}/aplaytest}:${CLI_TAG:-latest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # User-namespace GHCR has no REST API to flip visibility, and GITHUB_TOKEN
  # cannot do it. The first publish of each package is private until someone
  # clicks Public in the package settings. After that, later pushes stay public.
  # This job anonymous-pulls the image we just published so a private package
  # fails the workflow instead of looking like a successful public release.
  visibility:
    name: GHCR packages public
    needs: [cli, playwright]
    if: always() && needs.cli.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require anonymous pulls
        env:
          OWNER: ${{ github.repository_owner }}
          CLI_TAG: ${{ needs.cli.outputs.image-tag }}
          PW_TAG: ${{ needs.playwright.outputs.image-tag }}
          PW_RESULT: ${{ needs.playwright.result }}
        shell: bash
        run: |
          set -euo pipefail
          require_public() {
            local pkg="$1" ref="$2"
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${OWNER}/${pkg}/manifests/${ref}")
            if [ "$code" = "200" ]; then
              echo "::notice title=GHCR::${pkg}:${ref} is anonymously pullable"
              return 0
            fi
            echo "::error title=GHCR::${pkg} is not public (HTTP ${code} for tag ${ref})."
            echo "GitHub has no API to change visibility of a personal-account package."
            echo "Open https://github.com/users/${OWNER}/packages/container/${pkg}/settings"
            echo "Danger Zone → Change visibility → Public. One click; later pushes stay public."
            return 1
          }
          failed=0
          require_public aplaytest "${CLI_TAG:-main}" || failed=1
          if [ "$PW_RESULT" = "success" ]; then
            require_public aplaytest-playwright "${PW_TAG:-latest}" || failed=1
          fi
          exit "$failed"

