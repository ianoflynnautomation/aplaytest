# atest analyze — paste-in job for a repo whose CI already runs Playwright
#
# Reads the merged Playwright JSON that the test job ALREADY uploads, so it
# needs no change to the test repo (no reporter, no fixtures), no change to the
# Playwright workflow, and no model key — flake scoring is Tier 0, entirely
# deterministic.
#
# It is `continue-on-error` and gates nothing. Its only job is to build the
# history that flake scoring needs, and to say what it sees.
#
# Pin the called workflow to a tag or SHA once you have one, not `@main`.
#
# Leave `history-account` empty and everything still runs — the job scores this
# run alone against a throwaway store, so verdicts read "insufficient data" and
# nothing else in the pipeline changes.

atest_analyze:
  name: Flake Analysis (atest)
  needs: test # the job that uploaded the Playwright JSON artifact
  # `always()` because the interesting runs are the red ones. Skipped upstream
  # means no suite ran, so there is nothing to analyse.
  if: always() && needs.test.result != 'skipped'
  permissions:
    contents: read
    actions: read
    packages: read # the atest IMAGE is pulled from GHCR — the job runs in it
    id-token: write # mints the OIDC token for AZURE_FEDERATED_TOKEN_FILE
    pull-requests: write # only needed with comment-on-pr
  # Pin to a version tag after the first atest release (`v0.1.0`), not `@main`.
  uses: ianoflynnautomation/atest/.github/workflows/atest-analyze.yml@main
  with:
    results-artifact: playwright-json-results
    history-account: ${{ vars.ATEST_HISTORY_ACCOUNT }}
    # Namespaces this repo's history inside a shared account. The job that
    # writes (usually main) and the job that reads (usually PRs) must use the
    # SAME prefix — the PR scores against the baseline main writes.
    history-prefix: my-suite
    history-window-days: 90
    history-retain-days: 90
    # comment-on-pr: true          # PR only
    # `main` until atest cuts a release — docker-publish.yml only moves
    # `latest` on a version tag, so it does not exist yet.
    atest-tag: ${{ vars.ATEST_VERSION != '' && vars.ATEST_VERSION || 'main' }}
  secrets:
    AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    # Read-only on the history account. Used off main.
    AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    # The main-branch-only writer. Omit it on the PR workflow: a pull request
    # has no use for a credential it is not allowed to write with, and leaving
    # it out means the read-only path cannot be turned into a writing one by
    # editing one line of YAML.
    ATEST_HISTORY_CLIENT_ID: ${{ secrets.ATEST_HISTORY_CLIENT_ID }} # main only
